# Publish multi-architecture images. Pushes to main update head, and stable
# GitHub releases call this workflow to publish their version tag and latest.
name: images

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: images-${{ inputs.release_tag && 'release' || 'head' }}
  cancel-in-progress: ${{ !inputs.release_tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    if: inputs.release_tag != '' || github.ref == 'refs/heads/main'
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # The full image needs ~15 GB while building; make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Set the version from the release tag
        if: inputs.release_tag != ''
        run: |
          jq --arg version "${RELEASE_TAG#v}" '.version = $version' package.json > package.json.new
          mv package.json.new package.json

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed untagged (by digest); the merge job tags the multi-arch image.
      # `full` builds on `base`, so it reuses the layers just built in this job.
      - name: Build base
        id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/elseagent-cache:base-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/elseagent-cache:base-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.REGISTRY }}/elseagent-base,push-by-digest=true,name-canonical=true,push=true

      - name: Build full
        id: full
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/elseagent-cache:base-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/elseagent-cache:full-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/elseagent-cache:full-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.REGISTRY }}/elseagent-full,push-by-digest=true,name-canonical=true,push=true

      - name: Record digests
        run: |
          mkdir -p digests/base digests/full
          touch "digests/base/${BASE#sha256:}" "digests/full/${FULL#sha256:}"
        env:
          BASE: ${{ steps.base.outputs.digest }}
          FULL: ${{ steps.full.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags (amd64 + arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=(head)
          if [[ -n "$RELEASE_TAG" ]]; then
            tags=("$RELEASE_TAG")
            latest_release="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            if [[ "$latest_release" == "$RELEASE_TAG" ]]; then
              tags+=(latest)
            fi
          fi

          for image in base full; do
            name="$REGISTRY/elseagent-$image"
            refs=()
            for digest in "digests/$image"/*; do
              refs+=("$name@sha256:$(basename "$digest")")
            done
            destinations=()
            for tag in "${tags[@]}"; do
              destinations+=(-t "$name:$tag")
            done
            docker buildx imagetools create "${destinations[@]}" "${refs[@]}"
            for tag in "${tags[@]}"; do
              docker buildx imagetools inspect "$name:$tag"
            done
          done
