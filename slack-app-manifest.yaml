# Slack app manifest for one elseagent agent.
# Create the app at https://api.slack.com/apps > Create New App > From a manifest,
# then change the two names below to this agent's name (keep them the same):
#   display_information.name  - the app's name (app list, profile card, "APP" badge)
#   bot_user.display_name     - the bot user's name, used for @mentions; messages show this
#                               or the app name depending on the workspace's name settings
# After installing: copy the Bot User OAuth Token (xoxb-) from OAuth & Permissions, and create an
# App-Level Token with connections:write under Basic Information (xapp-).
display_information:
  name: elseagent
  description: Codex agent
  background_color: "#1d1d1d"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: elseagent
    always_online: true
  slash_commands:
    - command: /new
      description: Start our DM over with a new session
      should_escape: false
  # Slack's agent experience: DM threads, the "is working" status and its stop button.
  # Switching an existing app from assistant_view to agent_view cannot be undone.
  agent_view:
    agent_description: A Codex agent that works in your workspace, answers in threads and runs scheduled tasks.
oauth_config:
  scopes:
    bot:
      - app_mentions:read # receive @mentions
      - channels:history # read messages in public channels
      - groups:history # read messages in private channels it was invited to
      - im:history # read DMs
      - im:write # open DMs
      - chat:write # post messages and thread replies
      - reactions:write # add emoji reactions (e.g. a "working on it" marker)
      - files:read # read files people attach to messages
      - files:write # send files (charts, reports) with replies
      - channels:join # join public channels on its own
      - channels:read # look up public channels by name
      - groups:read # check membership of private channels used by scheduled tasks
      - users:read # resolve user names
      - commands # the /new slash command
      - assistant:write # agent sessions: the "is working" status and the stop button
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - agent_session_stopped # the stop button on "is working"
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
